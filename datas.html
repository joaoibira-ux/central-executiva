<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CentralExecutiva" />
  <meta name="theme-color" content="#040b1c" />
  <title>Datas importantes - Central Executiva</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icone.svg" />
  <link rel="stylesheet" href="./style.css?v=22" />
</head>
<body>
<header class="topo"><a href="./index.html" aria-label="Voltar">←</a><h2>Datas importantes</h2></header>
<main class="conteudo">
  <div id="lista"></div>
</main>
<button class="fab" id="novo" aria-label="Nova data">+</button>

<div class="modal" id="modal-ver"><div class="caixa">
  <div class="ver-campo" data-campo="nome"><b id="ver-nome" class="ver-titulo"></b></div>
  <div class="ver-campo" data-campo="data">
    <small>Data (todo ano)</small>
    <div id="ver-data"></div>
  </div>
  <div class="ver-campo" data-campo="tipo">
    <small>Tipo</small>
    <div id="ver-tipo"></div>
  </div>
  <div class="ver-campo" data-campo="contato">
    <small>Contato vinculado</small>
    <div id="ver-contato"></div>
  </div>
  <div class="ver-campo" data-campo="obs">
    <small>Observações</small>
    <div id="ver-obs"></div>
  </div>
  <a class="btn btn-largo" id="ver-parabens" style="display:none" target="_blank" rel="noopener">🎉 Mandar parabéns pelo WhatsApp</a>
  <div class="acoes">
    <button class="btn sec" id="ver-fechar">Fechar</button>
    <button class="btn perigo" id="ver-excluir">Excluir</button>
  </div>
</div></div>

<div class="modal" id="modal"><div class="caixa">
  <h3 id="modal-titulo">Nova data</h3>
  <label>Nome *</label><input id="f-nome" placeholder="Ex.: Aniversário da Maria" />
  <label>Dia e mês *</label><input id="f-data" type="date" />
  <label>Tipo</label>
  <select id="f-tipo">
    <option value="aniversario">🎂 Aniversário</option>
    <option value="reuniao">🤝 Reunião</option>
    <option value="feriado">🎉 Feriado</option>
    <option value="evento">📌 Evento</option>
    <option value="outro">📎 Outro</option>
  </select>
  <label>Contato vinculado</label>
  <button type="button" class="btn sec btn-largo" id="escolher-contato">👤 Vincular a um contato</button>
  <div id="f-contato-vinculado" class="anexos-lista"></div>
  <label>Observações</label><textarea id="f-obs"></textarea>
  <div class="acoes">
    <button class="btn sec" id="cancelar">Cancelar</button>
    <button class="btn perigo" id="excluir" style="display:none">Excluir</button>
    <button class="btn" id="salvar">Salvar</button>
  </div>
</div></div>

<div class="modal" id="modal-contato"><div class="caixa">
  <h3>Vincular a um contato</h3>
  <input id="busca-contato" class="busca" type="search" placeholder="Buscar contato..." />
  <div id="lista-contato"></div>
  <div class="acoes">
    <button class="btn sec" id="contato-cancelar">Cancelar</button>
  </div>
</div></div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js?v=1"></script>
<script src="./app.js?v=19"></script>
<script src="./datas.js?v=3"></script>
</body>
</html>
