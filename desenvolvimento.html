<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CentralExecutiva" />
  <meta name="theme-color" content="#040b1c" />
  <title>Desenvolvimento - Central Executiva</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icone.svg" />
  <link rel="stylesheet" href="./style.css?v=21" />
</head>
<body>
<header class="topo"><a href="./index.html" aria-label="Voltar">←</a><h2>Desenvolvimento</h2></header>
<main class="conteudo">
  <p class="imp-instrucao">Lista de pendências e ideias para o sistema — o que ainda falta ajustar, criar ou corrigir.</p>
  <div id="lista"></div>
</main>
<button class="fab" id="novo" aria-label="Novo item">+</button>

<div class="modal" id="modal-ver"><div class="caixa">
  <label class="ver-check"><input type="checkbox" id="ver-feito" /> Concluído</label>
  <div class="ver-campo" data-campo="texto"><b id="ver-texto" class="ver-titulo"></b></div>
  <div class="ver-campo" data-campo="nota">
    <small>Nota de conclusão</small>
    <div id="ver-nota"></div>
  </div>
  <div class="acoes">
    <button class="btn sec" id="ver-fechar">Fechar</button>
    <button class="btn perigo" id="ver-excluir">Excluir</button>
  </div>
</div></div>

<div class="modal" id="modal"><div class="caixa">
  <h3 id="modal-titulo">Novo item</h3>
  <label>Descrição *</label><textarea id="f-texto"></textarea>
  <label>Nota de conclusão</label><textarea id="f-nota"></textarea>
  <div class="acoes">
    <button class="btn sec" id="cancelar">Cancelar</button>
    <button class="btn perigo" id="excluir" style="display:none">Excluir</button>
    <button class="btn" id="salvar">Salvar</button>
  </div>
</div></div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js?v=1"></script>
<script src="./app.js?v=17"></script>
<script src="./desenvolvimento.js?v=1"></script>
</body>
</html>
