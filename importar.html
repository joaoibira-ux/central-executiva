<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#040b1c" />
  <title>Importar - Central Executiva</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icone.svg" />
  <link rel="stylesheet" href="./style.css?v=13" />
</head>
<body>
<header class="topo"><a href="./index.html" aria-label="Voltar">←</a><h2>Importar contatos</h2></header>
<main class="conteudo">
  <p class="imp-instrucao">No app Contatos do iPhone: selecione os contatos (ou todos) → Compartilhar → Salvar como vCard/Exportar → escolha "Salvar em Arquivos". Depois toque em "Escolher arquivo .vcf" abaixo e selecione o arquivo salvo.</p>
  <button class="btn sec btn-largo" id="escolher-vcf">Escolher arquivo .vcf</button>
  <input type="file" id="arquivo-vcf" accept=".vcf,text/vcard,text/x-vcard,text/x-vcalendar" style="display:none" />

  <div id="imp-vazio" class="vazio" style="display:none">Nenhum contato encontrado nesse arquivo.</div>
  <div id="imp-topo" class="imp-topo" style="display:none">
    <label class="ver-check"><input type="checkbox" id="imp-marcar-todos" /> Marcar todos</label>
    <span id="imp-contagem" class="imp-contagem"></span>
  </div>
  <div id="imp-lista"></div>
  <button class="btn btn-largo" id="imp-importar" style="display:none">Importar selecionados</button>
</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js?v=1"></script>
<script src="./app.js?v=4"></script>
<script src="./importar.js?v=1"></script>
</body>
</html>
