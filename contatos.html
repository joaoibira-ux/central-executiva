<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040b1c" />
  <title>Contatos - Central Executiva</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icone.svg" />
  <link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
<header class="topo"><a href="./index.html" aria-label="Voltar">←</a><h2>Contatos</h2></header><main class="conteudo">
  <input id="busca" class="busca" type="search" placeholder="Buscar contato..." />
  <div id="lista"></div>
</main>
<button class="fab" id="novo" aria-label="Novo contato">+</button>
<div class="modal" id="modal"><div class="caixa">
  <h3 id="modal-titulo">Novo contato</h3>
  <label>Nome *</label><input id="f-nome" />
  <label>Telefone / WhatsApp</label><input id="f-tel" type="tel" />
  <label>E-mail</label><input id="f-email" type="email" />
  <label>Empresa / Cargo</label><input id="f-empresa" />
  <label>Observações</label><textarea id="f-obs"></textarea>
  <div class="acoes">
    <button class="btn sec" id="cancelar">Cancelar</button>
    <button class="btn perigo" id="excluir" style="display:none">Excluir</button>
    <button class="btn" id="salvar">Salvar</button>
  </div>
</div></div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js?v=1"></script>
<script src="./app.js?v=1"></script>
<script src="./contatos.js?v=1"></script>
</body>
</html>
